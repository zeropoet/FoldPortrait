name: Autonomous Reflection Cycle

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - connected-system-changed

permissions:
  contents: write

concurrency:
  group: foldportrait-reflection
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint a connected-system installation token
        id: connected-system-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TELOS_BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TELOS_BRIDGE_APP_PRIVATE_KEY }}
          owner: zeropoet
          repositories: |
            Telos
            root-logos
          permission-contents: write

      - name: Check out FoldPortrait
        uses: actions/checkout@v7
        with:
          path: FoldPortrait
          fetch-depth: 0

      - name: Check out FoldKernel
        uses: actions/checkout@v7
        with:
          repository: zeropoet/foldkernel
          path: FoldKernel
          fetch-depth: 1

      - name: Check out FoldForge
        uses: actions/checkout@v7
        with:
          repository: zeropoet/FoldForge
          path: FoldForge
          fetch-depth: 1

      - name: Check out Root Logos
        uses: actions/checkout@v7
        with:
          repository: zeropoet/root-logos
          path: root-logos
          fetch-depth: 1

      - name: Check out Telos
        uses: actions/checkout@v7
        with:
          repository: zeropoet/Telos
          path: Telos
          fetch-depth: 1
          token: ${{ steps.connected-system-token.outputs.token }}

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Synchronize bounded public witness
        working-directory: FoldPortrait
        run: >-
          node Scripts/sync-system-witness.js
          --foldkernel ../FoldKernel
          --foldforge ../FoldForge
          --root-logos ../root-logos
          --telos ../Telos

      - name: Reflect and verify lineage
        working-directory: FoldPortrait
        run: |
          npm ci
          swift build
          swift test
          swift run fold-portrait reflect Reflection/system-witness.json
          swift run fold-portrait verify-reflection
          npm run archive
          npm run verify:archive
          npm run build:mint-catalog
          npm run verify:mint-catalog

      - name: Preserve a changed reflection
        id: reflection
        working-directory: FoldPortrait
        run: |
          if git diff --quiet -- Reflection Output/reflections Brand Mint; then
            echo "The witnessed system is unchanged; no reflection was added."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "foldportrait-reflection[bot]"
          git config user.email "foldportrait-reflection[bot]@users.noreply.github.com"
          git add Reflection Output/reflections Brand Mint
          git commit -m "Add autonomous system reflection"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wake Root Logos and propagate the reflection to Telos
        if: steps.reflection.outputs.changed == 'true'
        env:
          CONNECTED_SYSTEM_TOKEN: ${{ steps.connected-system-token.outputs.token }}
          SOURCE_SHA: ${{ steps.reflection.outputs.revision }}
        run: |
          echo "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          root_payload=$(jq -n --arg revision "$SOURCE_SHA" \
            '{event_type:"foldportrait-reflected",client_payload:{revision:$revision}}')
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://api.github.com/repos/zeropoet/root-logos/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CONNECTED_SYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$root_payload"
          occurred_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          telos_payload=$(jq -n \
            --arg source_repository "zeropoet/FoldPortrait" \
            --arg source_sha "$SOURCE_SHA" \
            --arg change_class "relation" \
            --arg summary "FoldPortrait preserved a new system reflection and render-lineage witness." \
            --arg witness_url "https://zeropoet.github.io/FoldPortrait/" \
            --arg occurred_at "$occurred_at" \
            '{event_type:"telos-propagation",client_payload:{source_repository:$source_repository,source_sha:$source_sha,change_class:$change_class,summary:$summary,witness_url:$witness_url,occurred_at:$occurred_at}}')
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://api.github.com/repos/zeropoet/Telos/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CONNECTED_SYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$telos_payload"
