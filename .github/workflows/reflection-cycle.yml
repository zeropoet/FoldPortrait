name: Autonomous Reflection Cycle

on:
  schedule:
    - cron: "17 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foldportrait-reflection
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint a read-only Telos installation token
        id: telos-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TELOS_BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TELOS_BRIDGE_APP_PRIVATE_KEY }}
          owner: zeropoet
          repositories: Telos
          permission-contents: read

      - name: Check out FoldPortrait
        uses: actions/checkout@v7
        with:
          path: FoldPortrait
          fetch-depth: 0

      - name: Check out FoldKernel
        uses: actions/checkout@v7
        with:
          repository: zeropoet/foldkernel
          path: FoldKernel
          fetch-depth: 1

      - name: Check out FoldForge
        uses: actions/checkout@v7
        with:
          repository: zeropoet/FoldForge
          path: FoldForge
          fetch-depth: 1

      - name: Check out Root Logos
        uses: actions/checkout@v7
        with:
          repository: zeropoet/root-logos
          path: root-logos
          fetch-depth: 1

      - name: Check out Telos
        uses: actions/checkout@v7
        with:
          repository: zeropoet/Telos
          path: Telos
          fetch-depth: 1
          token: ${{ steps.telos-token.outputs.token }}

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Synchronize bounded public witness
        working-directory: FoldPortrait
        run: >-
          node Scripts/sync-system-witness.js
          --foldkernel ../FoldKernel
          --foldforge ../FoldForge
          --root-logos ../root-logos
          --telos ../Telos

      - name: Reflect and verify lineage
        working-directory: FoldPortrait
        run: |
          npm ci
          swift build
          swift test
          swift run fold-portrait reflect Reflection/system-witness.json
          swift run fold-portrait verify-reflection
          npm run archive
          npm run verify:archive
          npm run build:mint-catalog
          npm run verify:mint-catalog

      - name: Preserve a changed reflection
        working-directory: FoldPortrait
        run: |
          if git diff --quiet -- Reflection Output/reflections Brand Mint; then
            echo "The witnessed system is unchanged; no reflection was added."
            exit 0
          fi
          git config user.name "foldportrait-reflection[bot]"
          git config user.email "foldportrait-reflection[bot]@users.noreply.github.com"
          git add Reflection Output/reflections Brand Mint
          git commit -m "Add autonomous system reflection"
          git pull --rebase origin main
          git push origin HEAD:main
