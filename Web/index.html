<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FoldPortrait — Autonomous Reflection</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="stage" aria-label="FoldPortrait Three.js topology" aria-keyshortcuts="ArrowLeft ArrowRight">
        <canvas id="topology-canvas"></canvas>
        <div class="view-actions" aria-label="View controls">
          <button id="gallery-button" class="view-button" type="button">Lineage archive</button>
          <button id="latest-button" class="view-button" type="button">Current reflection</button>
        </div>
        <section id="gallery-view" class="gallery-view" aria-label="FoldPortrait render iteration gallery" hidden>
          <header class="gallery-header">
            <div>
              <img class="archive-mark" src="../Brand/foldportrait-mark.svg" alt="" />
              <span>
                <span class="label">FoldPortrait archive</span>
                <strong>Era &amp; Lineage Matrix</strong>
              </span>
            </div>
            <button id="gallery-close" class="view-button" type="button">Current reflection</button>
          </header>
          <div id="gallery-grid" class="gallery-grid"></div>
        </section>
        <div class="readout" aria-live="polite">
          <div>
            <span class="label">State</span>
            <strong id="readout-iteration">loading</strong>
          </div>
          <div>
            <span class="label">Topology</span>
            <strong id="readout-count">0 shapes</strong>
          </div>
          <div>
            <span class="label">Render</span>
            <strong id="readout-hash">-</strong>
          </div>
          <div>
            <span class="label">Reflection</span>
            <strong id="readout-reflection">resolving</strong>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
